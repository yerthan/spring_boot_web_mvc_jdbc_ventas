<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Clientes</title>
    <style>
        .clearfix::after {
            content: "";
            display: block;
            clear: both;
        }

    </style>
</head>
<body>


<div class="container mx-auto px-4">
    <form  th:action="@{/clientes/editar/__${cliente.id}__}" th:object="${cliente}" method="post" >
        <div class="flex flex-row py-4 items-center border-b-2 p-2">
            <div class="basis-1/2 text-4xl">
                <h1>Editar Cliente</h1>
            </div>


            <div class="basis-1/2 flex justify-center">
                <!--RECUERDA: por defecto, button es type="submit",
                para controlar por js el envío usa type="button"-->
                <button class="btn btn-blue float-right">Guardar</button>
            </div>
        </div>
        <div class="flex flex-row my-0.5">
            <div>
                <label>ID</label>
                <input th:field="*{id}" value="id" readonly="readonly"/>
            </div>
            <div class="basis-1/2">
                <label th:text="#{msg.name.client}">Nombre</label>
            </div>
            <div class="basis-1/2">
                <input class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight" th:field="*{nombre}"  >
                <ul th:if="${#fields.hasErrors('nombre')}">
                    <li th:each="err : ${#fields.errors('nombre')}" th:text="${err}" class="error"></li>
                </ul>
            </div>
        </div>
        <div class="flex flex-row my-0.5">
            <div class="basis-1/2">
                <label th:text="#{msg.firstSurname.client}">Apellido1</label>
                <ul th:if="${#fields.hasErrors('apellido1')}">
                    <li th:each="err : ${#fields.errors('apellido1')}" th:text="${err}" class="error"></li>
                </ul>
            </div>
            <div class="basis-1/2">
                <input class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight" th:field="*{apellido1}"/>
            </div>
        </div>
        <div class="flex flex-row my-0.5">
            <div class="basis-1/2">
                <label th:text="#{msg.secondSurname.client}">Apellido 2</label>
                <ul th:if="${#fields.hasErrors('apellido2')}">
                    <li th:each="err : ${#fields.errors('apellido2')}" th:text="${err}" class="error"></li>
                </ul>
            </div>
            <div class="basis-1/2">
                <input class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight" th:field="*{apellido2}"/>
            </div>
            <div class="flex flex-row my-0.5">
                <div class="basis-1/2">
                    <label th:text="#{msg.city.client}">Ciudad</label>
                    <ul th:if="${#fields.hasErrors('ciudad')}">
                        <li th:each="err : ${#fields.errors('ciudad')}" th:text="${err}" class="error"></li>
                    </ul>
                </div>
                <div class="basis-1/2">
                    <input class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight" th:field="*{ciudad}"/>
                </div>
            </div>
            <div class="flex flex-row my-0.5">
                <div class="basis-1/2">
                    <label th:text="#{msg.category.client}">Categoria</label>
                    <ul th:if="${#fields.hasErrors('categoria')}">
                        <li th:each="err : ${#fields.errors('categoria')}" th:text="${err}" class="error"></li>
                    </ul>
                </div>
                <div class="basis-1/2">
                    <input class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight" th:field="*{categoria}"/>
                </div>
            </div>
        </div>

    </form>
</div>
</body>
</html>
